services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Override the values from .env so the bot talks to the services below
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-bot}:${POSTGRES_PASSWORD:-bot}@postgres:5432/${POSTGRES_DB:-bot}
      REDIS_URL: redis://redis:6379/0
    command: ["sh", "-c", "alembic upgrade head && exec python -m bot"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Webhook mode: set WEBHOOK_BASE_URL and WEBHOOK_SECRET in .env, put a reverse proxy with
    # HTTPS in front of the bot and publish the port:
    # ports:
    #   - "8080:8080"

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bot}
      POSTGRES_DB: ${POSTGRES_DB:-bot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
