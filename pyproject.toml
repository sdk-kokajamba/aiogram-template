[project]
name = "aiogram-bot-template"
version = "0.1.0"
description = "Production-ready Telegram bot template: aiogram 3, async SQLAlchemy 2, Alembic, uv."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram[redis]>=3.22,<4",
    "aiohttp>=3.10",
    "aiosqlite>=0.21",
    "alembic>=1.15",
    "asyncpg>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.8",
    "sqlalchemy[asyncio]>=2.0.40,<2.2",
]

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bot"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "ASYNC", "RUF"]
ignore = [
    "E501",   # line length is handled by the formatter
    "RUF001", # Cyrillic text in strings
    "RUF002", # Cyrillic text in docstrings
    "RUF003", # Cyrillic text in comments
]

[tool.ruff.lint.per-file-ignores]
# Alembic revision files are named like 2026_10_11_1200-<rev>_<slug>.py
"alembic/versions/*.py" = ["N999"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
# `Settings()` needs a call-arg ignore with the pydantic plugin on some versions only
warn_unused_ignores = false
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"

[tool.coverage.run]
source = ["src/bot"]
branch = true

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
